services:
  api:
    build: .
    container_name: airline_synth_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16
    container_name: airline_synth_postgres
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_synth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline_synth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: airline_synth_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
